name: Release to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        flink-version: ["2.2.1", "2.3.0"]
    name: Publish Flink ${{ matrix.flink-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches the library version
        if: github.event_name == 'push'
        run: |
          LIBRARY_VERSION=$(awk -F= '$1 == "libraryVersion" {print $2}' gradle.properties)
          test "${GITHUB_REF_NAME}" = "v${LIBRARY_VERSION}"
      - name: Build, test, sign, and bundle
        run: ./gradlew check centralBundle -PflinkVersion=${{ matrix.flink-version }} --stacktrace
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Upload to Sonatype Central
        run: |
          DEPLOYMENT_ID=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $CENTRAL_TOKEN" \
            --form bundle=@build/distributions/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${GITHUB_REF_NAME:-manual}-flink-${{ matrix.flink-version }}&publishingType=AUTOMATIC")
          echo "Central deployment ID: $DEPLOYMENT_ID"
          echo "Central deployment ID: \`$DEPLOYMENT_ID\` (Flink ${{ matrix.flink-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle accepted by Central; validation and automatic publishing continue asynchronously."
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}

  create-github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
